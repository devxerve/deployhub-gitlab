# OAuth scope strings (e.g. "https://www.googleapis.com/auth/userinfo.profile")
# contain ".profile", which the LFI rule's OS-filename list (lfi-os-files.data,
# think ~/.profile) matches as a false positive, tipping the anomaly score
# over ANOMALY_INBOUND and blocking the Google/GitHub/42 OAuth callback with
# a 403. Excluding just the "scope" arg from that rule keeps the rest of the
# LFI protection intact.
SecRuleUpdateTargetById 930120 "!ARGS:scope"
