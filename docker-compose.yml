services:
  cert-init:
    image: alpine/openssl
    container_name: cert_init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -s /certs/ca.pem ] || [ ! -s /certs/cert.pem ] || [ ! -s /certs/key.pem ]; then
          echo "Generating local CA and wildcard TLS certificate for *.localhost..."

          # 1. Local root CA (import this once into your browser/OS trust store)
          openssl genrsa -out /certs/ca-key.pem 4096
          openssl req -x509 -new -nodes -key /certs/ca-key.pem -sha256 -days 3650 \
            -out /certs/ca.pem -subj "/CN=DeployHub Local CA"

          # 2. Leaf certificate covering localhost and any *.localhost subdomain
          #    (api.localhost, auth.localhost, grafana.localhost, <deploy-id>.localhost, ...)
          openssl genrsa -out /certs/key.pem 2048
          openssl req -new -key /certs/key.pem -out /certs/server.csr -subj "/CN=localhost"
          printf 'subjectAltName=DNS:localhost,DNS:*.localhost,IP:127.0.0.1\n' > /certs/server-ext.cnf
          openssl x509 -req -in /certs/server.csr -CA /certs/ca.pem -CAkey /certs/ca-key.pem \
            -CAcreateserial -out /certs/cert.pem -days 825 -sha256 -extfile /certs/server-ext.cnf

          rm -f /certs/server.csr /certs/server-ext.cnf
          chmod 644 /certs/cert.pem /certs/ca.pem
          chmod 600 /certs/key.pem /certs/ca-key.pem
        else
          echo "TLS certificate already present, skipping generation."
        fi
    volumes:
      - "./services/infra/traefik/certs:/certs"
    network_mode: "none"

  traefik:
    image: traefik:v2.11
    container_name: traefik
    depends_on:
      cert-init:
        condition: service_completed_successfully
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=paas_network"
      # HTTP and HTTPS entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Automatic HTTP → HTTPS redirect
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Dynamic config (TLS certificates)
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      # ModSecurity WAF plugin
      - "--experimental.plugins.modsecurity.moduleName=github.com/acouvreur/traefik-modsecurity-plugin"
      - "--experimental.plugins.modsecurity.version=v1.3.0"
    ports:
      # Host-side ports are unprivileged (>1024) so `docker compose up` works
      # without root/sudo or CAP_NET_BIND_SERVICE. Traefik still listens on
      # the standard :80/:443 *inside* its own container (see entrypoints
      # below) — only the host-facing mapping changes.
      - "8000:80"
      - "8443:443"
      - "8080:8080"
    volumes:
      - "${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro"
      - "./services/infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
      - "./services/infra/traefik/certs:/etc/traefik/certs:ro"
    labels: []
    networks:
      - paas_network

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: modsecurity_waf
    environment:
      # Paranoia level 1 = balanced (blocks obvious attacks, low false positives)
      - PARANOIA=1
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
      - ALLOWED_METHODS=GET HEAD POST OPTIONS DELETE PUT PATCH
      - BACKEND=http://dummy:80
    volumes:
      - "./services/infra/modsecurity/request-900-exclusion-before-crs.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro"
    networks:
      - paas_network

  dummy:
    image: traefik/whoami
    container_name: dummy_backend
    networks:
      - paas_network

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: nest_backend
    env_file:
      - ./services/backend/.env
    environment:
      - PROMETHEUS_URL=${PROMETHEUS_URL}
      - PORT=3001
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres_db:5432/${DB_NAME}?schema=public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.localhost`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.middlewares=waf@docker"
      - "traefik.http.middlewares.waf.plugin.modsecurity.modSecurityUrl=http://waf:8080"
      - "traefik.http.middlewares.waf.plugin.modsecurity.maxBodySize=10485760"
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
      # Same-origin path under the app's own host, so the session cookie
      # never has to cross a site boundary (api.localhost is a different
      # "site" than localhost as far as browsers are concerned).
      - "traefik.http.routers.backend-local.rule=Host(`localhost`) && PathPrefix(`/api/backend`)"
      - "traefik.http.routers.backend-local.entrypoints=websecure"
      - "traefik.http.routers.backend-local.tls=true"
      - "traefik.http.routers.backend-local.priority=100"
      - "traefik.http.routers.backend-local.service=backend"
      - "traefik.http.routers.backend-local.middlewares=strip-api-backend,waf@docker"
      - "traefik.http.middlewares.strip-api-backend.stripprefix.prefixes=/api/backend"
    volumes:
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock  # DooD
      # DEPLOY_TMP_DIR (services/backend/.env) must match this path on BOTH
      # sides: this container clones/builds here, then asks the *host*
      # dockerd (via the socket above) to build/run from that same path, so
      # the path has to exist for real on the host too. /tmp is used
      # (instead of e.g. /app/tmp) because it's world-writable — no root/sudo
      # needed to create it, unlike a path directly under /.
      - /tmp/transcendence-deploys:/tmp/transcendence-deploys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - paas_network
      - bbdd_network

  db:
    build:
      context: ./services/database
      dockerfile: Dockerfile
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - bbdd_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes:
      - ./services/infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./services/infra/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    networks:
      - paas_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--disable_metrics=disk,diskIO"
    networks:
      - paas_network

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    volumes:
      - ./services/infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - paas_network

  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    networks:
      - paas_network
    volumes:
      - ./services/infra/grafana/provisioning:/etc/grafana/provisioning


  auth_service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres_db:5432/${DB_NAME}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - PORT_AUTH_SERVICE=${PORT_AUTH_SERVICE}
      - APP_BASE_URL=${APP_BASE_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - INTRA_CLIENT_ID=${INTRA_CLIENT_ID}
      - INTRA_CLIENT_SECRET=${INTRA_CLIENT_SECRET}
      - INTRA_REDIRECT_URI=${INTRA_REDIRECT_URI}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`auth.localhost`)"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls=true"
      - "traefik.http.routers.auth.middlewares=waf@docker"
      - "traefik.http.services.auth.loadbalancer.server.port=3001"
      # Google's OAuth policy only exempts the exact host "localhost" (or
      # loopback IPs) from domain verification, not subdomains like
      # auth.localhost — so the Google callback needs this path-based route
      # on plain localhost instead.
      - "traefik.http.routers.auth-local.rule=Host(`localhost`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.auth-local.entrypoints=websecure"
      - "traefik.http.routers.auth-local.tls=true"
      - "traefik.http.routers.auth-local.priority=100"
      - "traefik.http.routers.auth-local.service=auth"
      - "traefik.http.routers.auth-local.middlewares=waf@docker"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${PORT_AUTH_SERVICE}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - paas_network
      - bbdd_network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_AUTH_SERVICE_URL=${NEXT_PUBLIC_AUTH_SERVICE_URL}
        - NEXT_PUBLIC_GRAFANA_URL=${NEXT_PUBLIC_GRAFANA_URL}
    container_name: frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_AUTH_SERVICE_URL=${NEXT_PUBLIC_AUTH_SERVICE_URL}
      - NEXT_PUBLIC_GRAFANA_URL=${NEXT_PUBLIC_GRAFANA_URL}
      - APP_BASE_URL=${APP_BASE_URL}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`) || Host(`127.0.0.1`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - paas_network

networks:
  paas_network:
    name: paas_network
  bbdd_network:
    internal: true

volumes:
  db_data:
  prometheus_data:
